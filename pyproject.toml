[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hermeneutics"]

[project]
name = "hermeneutics-poc"
version = "0.2.0"
description = "Agentic hadith commentary hermeneutics PoC"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.40",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.7",
    "transformers>=4.44",
    "python-dotenv>=1.0.0",
    "networkx>=3.0",
    "python-louvain>=0.16",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.0.0",
    "nbconvert>=7.0.0",
    "pyvis>=0.3.2",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",
    "camel-tools>=1.5.5",
]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
